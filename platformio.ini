; Waveshare ESP32-S3-Touch-LCD-7 (800x480 RGB, GT911 Touch, CH422G IO-Expander)
[env:waveshare-s3-lcd7]
; pioarduino: Arduino-Core 3.x / ESP-IDF 5.5 (noetig fuer Bounce-Buffer des RGB-Displays)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; 16 MB Flash, 8 MB Octal-PSRAM
board_upload.flash_size = 16MB
board_build.partitions = partitions_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.f_cpu = 240000000L

extra_scripts =
    pre:scripts/version.py
    post:scripts/ota_auth.py

; Kartenbilder (1600x800, 256 Farben) direkt in die Firmware einbetten
board_build.embed_files =
    assets/map_day.bin
    assets/map_night.bin

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -O2

; ESP-IDF-Optionen fuer stabiles RGB-Display mit Framebuffer im PSRAM
; (pioarduino baut die Arduino-Bibliotheken damit neu)
custom_sdkconfig =
    CONFIG_SPIRAM_XIP_FROM_PSRAM=y
    CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
    CONFIG_ESP32S3_DATA_CACHE_64KB=y
    CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
    CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y
    CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y

lib_deps =
    lvgl/lvgl@~8.3.11
    bblanchon/ArduinoJson@^7.2.1
