name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # fuer git describe (Versionsnummer)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Host-Tests (Astronomie, Geo, Karten-Rendering)
        run: |
          c++ -std=c++17 -Isrc test/host/test_astro.cpp src/astro.cpp -o test_astro && ./test_astro
          c++ -O2 -std=c++17 -Isrc test/host/render_map.cpp test/host/maps_file.cpp src/map_render.cpp src/astro.cpp -o render_map
          ./render_map 1781964000 560 280 1 0 0 karte.ppm
          ./render_map 1781964000 800 480 6 50 10 zoom.ppm
          cc -c src/data/cty_data.c -o cty_data.o
          c++ -std=c++17 -Isrc test/host/test_cty.cpp src/cty.cpp cty_data.o -o test_cty && ./test_cty
          c++ -std=c++17 -Isrc test/host/test_spots.cpp src/spots.cpp src/cty.cpp cty_data.o -o test_spots && ./test_spots

      - name: PlatformIO installieren
        run: pip install platformio esptool

      - name: Dummy-secrets.h anlegen
        run: cp include/secrets.h.example include/secrets.h

      # Beim ersten Lauf baut pioarduino die Arduino-Bibliotheken mit custom_sdkconfig neu
      # und bricht danach mit einem SCons-Fehler ab; der zweite Lauf baut dann die Firmware.
      - name: Firmware bauen
        run: pio run || pio run

      - name: Factory-Image erzeugen
        run: |
          B=.pio/build/waveshare-s3-lcd7
          APP0=~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin
          python -m esptool --chip esp32s3 merge-bin \
            -o esp32-hamclock-factory.bin --flash-mode keep --flash-size 16MB \
            0x0 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 $APP0 0x10000 $B/firmware.bin
          cp $B/firmware.bin esp32-hamclock-app.bin

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: esp32-hamclock-*.bin

      - name: Release erstellen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: esp32-hamclock-*.bin
          generate_release_notes: true
